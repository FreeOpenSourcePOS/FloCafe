name: Full Cross-Platform Matrix

# Runs on merges/pushes to main, nightly schedule, and manual workflow_dispatch.
# Does NOT run on pull requests (PRs are validated with fast, focused CI in ci.yml).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-matrix:
    name: build-${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
            target: --linux
            extra-deps: sudo apt-get update -qq && sudo apt-get install -y fakeroot dpkg xvfb
          # better-sqlite3 >= v13 ships prebuilt binaries for all platforms,
          # so no native cross-compilation is needed. Both builds run on the
          # same ARM64 runner; electron-builder packages the correct prebuild
          # and afterPack.js validates the architecture.
          - name: macos-x64
            os: macos-latest
            arch: x64
            target: --mac --x64
            extra-deps: echo "No extra deps needed"
          - name: macos-arm64
            os: macos-latest
            arch: arm64
            target: --mac --arm64
            extra-deps: echo "No extra deps needed"
          - name: windows-x64
            os: windows-latest
            arch: x64
            target: --win
            extra-deps: echo "No extra deps needed"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install platform dependencies
        run: ${{ matrix.extra-deps }}

      - name: Install npm dependencies
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile main process
        run: npm run build

      - name: Run full platform test suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a --server-args='-screen 0 1280x800x24' npm test
          else
            npm test
          fi

      - name: Package (unpacked directory, no installer)
        run: npx electron-builder ${{ matrix.target }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flocafe-build-${{ matrix.name }}
          path: release/
          retention-days: 7
