name: Restaurant Workflow Feedback
description: Share how FloCafe fits or misses a real cafe, restaurant, kitchen, or food truck workflow
labels: ["workflow-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Real operator feedback helps FloCafe improve faster than generic feature requests. Describe the actual service flow you tried or need.

  - type: dropdown
    id: business_type
    attributes:
      label: Business type
      options:
        - Cafe / Coffee shop
        - Restaurant
        - Cloud kitchen
        - Bakery
        - Food truck
        - Quick service / Fast food
        - Bar / Pub
        - Other
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What were staff trying to do?
      placeholder: "Example: Take a dine-in order, send drinks to bar station, send food to kitchen, split payment, print final receipt."
    validations:
      required: true

  - type: textarea
    id: current_result
    attributes:
      label: What happened in FloCafe?
      description: What worked, what was confusing, and what blocked the workflow?
    validations:
      required: true

  - type: textarea
    id: desired_result
    attributes:
      label: What would make this usable?
      description: Describe the smallest change that would let a real shift keep moving.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Setup details
      description: Include operating system, FloCafe version, printer type, payment flow, tax region, and number of terminals if relevant.

