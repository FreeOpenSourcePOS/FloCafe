version: 2
updates:
  # Root and frontend dependencies (lockstep so shared tools like oxfmt/oxlint/typescript update together)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    groups:
      shared-tooling:
        group-by: "dependency-name"
        patterns:
          - "oxfmt"
          - "oxlint"
          - "typescript"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "oxfmt"
          - "oxlint"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci):"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
