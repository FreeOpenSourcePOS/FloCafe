# ---------------------------------------------------------------
# FloCafe — CI Validation
# ---------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Dependency Review (Security)
  dependency-review:
    name: Security & Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # 2. Path Filtering
  changes:
    name: Path Filtering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      kds: ${{ steps.filter.outputs.kds }}
      db: ${{ steps.filter.outputs.db }}
      uninstaller: ${{ steps.filter.outputs.uninstaller }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend: ['frontend/**', 'package.json', 'package-lock.json', '.github/workflows/ci.yml']
            backend: ['main/**', 'tests/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/ci.yml']
            kds: ['main/kds-server.ts', 'main/services/kds.ts', 'main/routes/kds.ts', 'tests/kds-*.test.ts']
            db: ['main/db.ts', 'main/migrations/**', 'tests/fixtures/upgrade-snapshots/**', 'tests/upgrade-path.test.ts']
            uninstaller: ['scripts/uninstallers/**', 'tests/windows-uninstaller.Tests.ps1', 'tests/run-windows-uninstaller-tests.cjs', 'package.json', 'package-lock.json', '.github/workflows/ci.yml']

  # 3. Tax Safety Net
  # This deliberately runs independently of path filtering so every push to
  # main gets a visible status for the no-category-means-no-tax invariant.
  tax-category-invariant:
    name: Tax invariant — uncategorized products remain zero-tax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Uncategorized products must never charge legacy fallback tax
        run: npm run test:tax-engine

  # 4. Linux Baseline
  linux-baseline:
    name: Lint & Build Validation (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.kds == 'true' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Backend lint
        run: npm run lint:backend

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        run: cd frontend && npx cross-env NEXT_BUILD_MODE=desktop npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # 4b. Linux Core Test Suite (sharded)
  # `npm test` runs ~90 suites serially (~3.5 min) and dominated the PR critical
  # path. Run the same suites as two round-robin shards on separate runners —
  # they run in parallel with the build/lint job above, cutting merge-ready time
  # instead of just the job's own wall time. Shards MUST be separate runners:
  # several auth suites interfere when run concurrently on one machine.
  linux-tests:
    name: Core Test Suite (Shard ${{ matrix.shard_number }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.kds == 'true' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        include:
          - shard: 0
            shard_number: 1
          - shard: 1
            shard_number: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Payment method split checks (npm pretest)
        if: matrix.shard == 0
        run: bash tests/run-test.sh npm run test:payment-methods-split

      - name: Core test suite (shard ${{ matrix.shard }})
        # The suite list is derived from package.json's "test" script at run
        # time, so shard coverage cannot drift from a hand-maintained list.
        run: |
          SHARD_TOTAL=2 SHARD_INDEX=${{ matrix.shard }} node scripts/ci/run-test-shard.cjs

  # 5. Playwright E2E
  e2e-playwright:
    name: End-to-End Playwright Tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.kds == 'true' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w better-sqlite3 || npm rebuild better-sqlite3

      - name: Build main backend process
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install frontend dependencies for Playwright
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run renderer and printer regression suites
        run: npm run test:release-regressions
        env:
          CI: true
          REQUIRE_VISUAL_EVIDENCE: '1'
          EVIDENCE_DIR: ${{ runner.temp }}/flocafe-release-regressions

      - name: Run Playwright tests
        working-directory: frontend
        # This job is the browser-only layer. The Electron project has its own
        # config and dedicated native job with an explicit display server.
        run: npx playwright test --config=playwright.config.ts --project=chromium
        env:
          CI: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 10

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-regression-evidence
          path: ${{ runner.temp }}/flocafe-release-regressions/
          if-no-files-found: ignore
          retention-days: 10

  # 5b. Native Electron E2E
  # Keep this lifecycle separate from the browser webServer. The native
  # harness owns its temporary profile, database, ports, and app services.
  native-e2e-playwright:
    name: Native Electron Playwright Tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.kds == 'true' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3 || npm rebuild better-sqlite3

      - name: Build main backend process
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install frontend dependencies for Playwright
        working-directory: frontend
        run: npm ci

      - name: Run native Electron tests under Xvfb
        # Playwright supplies --no-sandbox for Electron on Linux. Xvfb is the
        # required visible display; no packaged or modified app is launched.
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' npm run test:e2e:electron
        env:
          CI: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-playwright-report
          path: frontend/playwright-report/
          retention-days: 10

  # 6. Windows Uninstaller Pester Suite
  windows-uninstaller:
    name: Windows Uninstaller Tests
    needs: changes
    if: ${{ needs.changes.outputs.uninstaller == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # The wrapper only uses Node built-ins and probes the Windows runtime/Pester.
      # Do not run the application lifecycle or install its dependencies here.
      - name: Run Windows uninstaller Pester tests
        run: node tests/run-windows-uninstaller-tests.cjs
