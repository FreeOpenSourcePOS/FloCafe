name: Publish Tax Pack

on:
  push:
    tags:
      - 'tax-pack-*-v*'

permissions:
  contents: read

concurrency:
  group: tax-pack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download the newest published catalog
        id: previous-catalog
        env:
          GH_TOKEN: ${{ secrets.TAX_PACK_RELEASE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tax-pack-previous"
          LATEST_TAG="$(gh api --paginate "repos/FreeOpenSourcePOS/FloCafe-Plugins/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | select(.tag_name | test("^tax-pack-[a-z0-9][a-z0-9-]*-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name' \
            | sed -n '1p')"
          if [ -n "$LATEST_TAG" ]; then
            gh release download "$LATEST_TAG" \
              --repo FreeOpenSourcePOS/FloCafe-Plugins \
              --pattern catalog.json \
              --dir "$RUNNER_TEMP/tax-pack-previous"
            echo "path=$RUNNER_TEMP/tax-pack-previous/catalog.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign pack and build cumulative catalog
        env:
          TAX_PACK_SIGNING_KEY: ${{ secrets.TAX_PACK_SIGNING_KEY }}
          PREVIOUS_CATALOG: ${{ steps.previous-catalog.outputs.path }}
        run: |
          ARGS=(--tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/tax-pack-release")
          if [ -n "$PREVIOUS_CATALOG" ]; then
            ARGS+=(--catalog "$PREVIOUS_CATALOG")
          fi
          node scripts/tax-packs/prepare-release.cjs "${ARGS[@]}"

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.TAX_PACK_RELEASE_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/tax-pack-release/* \
            --repo FreeOpenSourcePOS/FloCafe-Plugins \
            --title "$GITHUB_REF_NAME" \
            --notes "Signed FloCafe country-pack release. Activation remains an explicit owner action in the app."
