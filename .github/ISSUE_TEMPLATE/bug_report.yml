name: Bug Report
description: Report a bug, crash, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide the details below.

        > **Security & Privacy Reminder:** Do NOT upload real customer databases, credentials, API keys, `.env` files, or private business records. If reporting a security vulnerability, please report it privately per [SECURITY.md](https://github.com/FreeOpenSourcePOS/FloCafe/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise summary of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error text if any).
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - GitHub / direct installer
        - Mac App Store
        - Microsoft Store
        - AppImage
        - deb
        - rpm
        - Snap
        - Source / development build
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FloCafe version
      description: "Exact version from app menu: FloCafe > About"
    validations:
      required: true

  - type: input
    id: os_details
    attributes:
      label: OS version & architecture (optional)
      description: "e.g., Windows 11 x64, macOS 14.5 Apple Silicon, Ubuntu 24.04"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or printer output
      description: "Paste relevant error lines from Help > Open Logs Folder (main.log). Redact any private information."

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots & hardware context
      description: Drag and drop screenshots, screen recordings, or printer make/model details if helpful.
